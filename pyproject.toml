[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-tool"
version = "1.0.0"
description = "A simple, pluggable Automatic Speech Recognition (ASR) command-line tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "SpeechRecognition>=3.10,<4",
    "pocketsphinx>=5.0,<6",
]

[project.optional-dependencies]
whisper = ["openai-whisper"]
mic = ["PyAudio>=0.2.13"]
dev = ["pytest>=7.0"]

[project.scripts]
asr-tool = "asr_tool.cli:main"

[tool.setuptools.packages.find]
include = ["asr_tool*"]
